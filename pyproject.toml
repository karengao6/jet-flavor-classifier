[project]
name = "jet-flavor-classifier"
version = "0.1.0"
description = "Machine learning for jet flavor classification using the ATLAS Open Data jet-flavor dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cernopendata-client>=1.0.2",
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"